<!DOCTYPE html>
<html>
<head>
    <title>Find JS Error</title>
    <script>
        // Capture all errors
        window.errors = [];
        window.onerror = function(msg, url, line, col, error) {
            window.errors.push({
                message: msg,
                source: url,
                line: line,
                column: col,
                error: error
            });
            console.error('Caught error:', msg, 'at', url, ':', line);
            return true;
        };
        
        window.addEventListener('error', function(e) {
            window.errors.push({
                message: e.message,
                filename: e.filename,
                lineno: e.lineno,
                colno: e.colno
            });
        }, true);
    </script>
</head>
<body>
    <h1>JavaScript Error Detector</h1>
    <button onclick="testSite()">Test Finding Sports for Errors</button>
    
    <div id="results" style="margin: 20px; padding: 20px; background: #f0f0f0;">
        <h2>Results will appear here...</h2>
    </div>
    
    <script>
    function testSite() {
        const results = document.getElementById('results');
        results.innerHTML = '<h2>Testing...</h2>';
        
        // Create iframe to test the site
        const iframe = document.createElement('iframe');
        iframe.style.width = '100%';
        iframe.style.height = '600px';
        iframe.style.border = '2px solid red';
        
        // Try to catch errors from iframe
        iframe.onerror = function(e) {
            console.error('Iframe error:', e);
        };
        
        iframe.onload = function() {
            setTimeout(() => {
                let html = '<h2>Test Results:</h2>';
                
                // Check our captured errors
                if (window.errors.length > 0) {
                    html += '<h3 style="color: red;">❌ JavaScript Errors Found:</h3>';
                    html += '<ul>';
                    window.errors.forEach(err => {
                        html += `<li style="color: red;">${err.message} (${err.source}:${err.line})</li>`;
                    });
                    html += '</ul>';
                } else {
                    html += '<p style="color: green;">✅ No JavaScript errors detected</p>';
                }
                
                // Try to access iframe content
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const bodyText = iframeDoc.body.innerText || '';
                    
                    html += '<h3>Iframe Content:</h3>';
                    html += `<p>Body text length: ${bodyText.length} characters</p>`;
                    
                    if (bodyText.length < 50) {
                        html += '<p style="color: red;">❌ Page appears empty/white!</p>';
                    } else {
                        html += '<p style="color: green;">✅ Page has content</p>';
                        html += `<p>Preview: ${bodyText.substring(0, 100)}...</p>`;
                    }
                } catch (e) {
                    html += '<p>Cannot access iframe content (CORS)</p>';
                }
                
                html += '<h3>Visual Check:</h3>';
                html += '<p>Look at the red-bordered iframe below. Is it white/blank?</p>';
                
                results.innerHTML = html;
            }, 3000);
        };
        
        iframe.src = 'https://findingsports.com';
        document.body.appendChild(iframe);
    }
    </script>
</body>
</html>
