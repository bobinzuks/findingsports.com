[build]
builder = "nixpacks"
buildCommand = "python -m pip install -r railway-requirements.txt"
watchPatterns = ["railway-*.py", "railway-requirements.txt"]

[deploy]
startCommand = "python -m gunicorn railway_integration:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --log-level info"
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30