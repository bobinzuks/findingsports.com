<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FindingSports</title>
  <script>
    // GitHub Pages SPA redirect: converts /g/slug to /?p=/g/slug
    // The main app reads this query param and navigates to the right route
    var pathSegmentsToKeep = 1; // keep /findingsports.com
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
