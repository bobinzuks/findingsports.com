<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Test</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #test-map {
            width: 100%;
            height: 500px;
            border: 2px solid #f4c542;
            border-radius: 8px;
        }
        .info {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="info">
        <h2>Map Test Page</h2>
        <p>This page tests if Leaflet is loading correctly.</p>
        <p id="status">Loading map...</p>
    </div>
    <div id="test-map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        try {
            // Initialize map
            const map = L.map('test-map').setView([49.2827, -123.1207], 11);
            
            // Add tile layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors © CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);
            
            // Add a test marker
            L.marker([49.2827, -123.1207]).addTo(map)
                .bindPopup('Vancouver Downtown')
                .openPopup();
            
            document.getElementById('status').textContent = 'Map loaded successfully!';
            document.getElementById('status').style.color = '#4CAF50';
        } catch (error) {
            document.getElementById('status').textContent = 'Error loading map: ' + error.message;
            document.getElementById('status').style.color = '#ff4444';
            console.error('Map error:', error);
        }
    </script>
</body>
</html>
