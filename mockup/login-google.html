                <!-- Social Auth Section -->
                <div class="social-auth">
                    <!-- Google Sign-In Button (rendered by Google) -->
                    <div id="googleSignInButton"></div>

                    <!-- Alternative custom Google button -->
                    <button class="google-signin" onclick="GoogleAuth.signIn()">

                    <!-- Facebook Sign-In (placeholder) -->

                        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                            <path
                                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"

                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- Traditional Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email" />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="Enter your password"
                        />
                    </div>
                    <button type="submit" class="login-btn">Sign In</button>
                </form>

                <p class="signup-prompt">
                    New to Finding Sports?
                    <a href="#" onclick="showSignup()">Create an account</a>

                <div class="demo-info">
                    <p>Demo Account:</p>
                    <p>Email: demo@example.com</p>
                    <p>Password: demo123</p>
                </div>
            </div>
        </div>

        <!-- Load API script first -->
        <script src="js/api.js?v=1752417024232"></script>
        
        <!-- Load Google OAuth script -->
        <script src="auth/google-oauth.js?v=1752417024232"></script>

        <!-- Existing login script -->
        <script src="js/auth.js?v=1752417024232"></script>

        <!-- Initialize Google Auth -->
        <script>
            // Initialize Google OAuth when page loads
            window.addEventListener('load', () => {
                // Ensure API is loaded
                if (!window.api) {
                    console.error('API not loaded');
                    window.showError('Failed to load authentication system');
                    return;
                }
                
                // Initialize Google Auth
                if (window.GoogleAuth && window.GoogleAuth.initialize) {
                    window.GoogleAuth.initialize();
                } else {
                    console.error('Google Auth not loaded');
                    window.showError('Failed to load Google authentication');
                }
            });

            // Show signup form (placeholder)
            function showSignup() {
                alert('Signup form will open here. For now, use Google Sign-In!');
            }
            
            // Error display function if not defined
            if (!window.showError) {
                window.showError = function(message) {
                    const errorDiv = document.getElementById('authError');
                    if (errorDiv) {
                        errorDiv.textContent = message;
                        errorDiv.style.display = 'block';
                    } else {
                        alert(message);
                    }
                };
            }
        </script>
