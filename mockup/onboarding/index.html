<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Finding Sports - Welcome!</title>
        <link rel="stylesheet" href="../styles.css" />
        <style>
            /* Onboarding specific styles */
            .onboarding-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .onboarding-box {
                background: #1f2028;
                border-radius: 16px;
                padding: 40px;
                max-width: 600px;
                width: 100%;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            }

            .progress-bar {
                height: 4px;
                background: #2a2b35;
                border-radius: 2px;
                margin-bottom: 40px;
                overflow: hidden;
            }

            .progress-fill {
                height: 100%;
                background: #5e9eff;
                transition: width 0.3s ease;
            }

            .step-content {
                min-height: 400px;
            }

            .step-title {
                font-size: 28px;
                margin-bottom: 16px;
                color: #e8e9f0;
            }

            .step-description {
                font-size: 16px;
                color: #b8bdd8;
                margin-bottom: 32px;
            }

            /* Location selector */
            .location-options {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 12px;
                margin-bottom: 32px;
            }

            .location-card {
                padding: 20px;
                background: #2a2b35;
                border: 2px solid transparent;
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.2s;
                text-align: center;
            }

            .location-card:hover {
                border-color: #5e9eff;
                transform: translateY(-2px);
            }

            .location-card.selected {
                background: #5e9eff;
                color: white;
            }

            .location-card .city-name {
                font-size: 18px;
                font-weight: 600;
            }

            .location-card .city-info {
                font-size: 14px;
                opacity: 0.8;
                margin-top: 4px;
            }

            /* Sports selector */
            .sports-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 16px;
                margin-bottom: 32px;
            }

            .sport-card {
                padding: 20px;
                background: #2a2b35;
                border: 2px solid transparent;
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.2s;
                text-align: center;
            }

            .sport-card:hover {
                border-color: #5e9eff;
                transform: translateY(-2px);
            }

            .sport-card.selected {
                background: #5e9eff;
                color: white;
            }

            .sport-icon {
                font-size: 36px;
                margin-bottom: 8px;
            }

            .sport-name {
                font-size: 14px;
                font-weight: 500;
            }

            /* MCP Server selector */
            .mcp-servers {
                max-height: 400px;
                overflow-y: auto;
                margin-bottom: 32px;
            }

            .mcp-server-card {
                padding: 16px;
                background: #2a2b35;
                border: 2px solid transparent;
                border-radius: 12px;
                margin-bottom: 12px;
                cursor: pointer;
                transition: all 0.2s;
            }

            .mcp-server-card:hover {
                border-color: #5e9eff;
            }

            .mcp-server-card.selected {
                border-color: #5e9eff;
                background: rgba(94, 158, 255, 0.1);
            }

            .mcp-server-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
            }

            .mcp-server-name {
                font-size: 16px;
                font-weight: 600;
                color: #e8e9f0;
            }

            .mcp-server-stats {
                display: flex;
                gap: 12px;
                font-size: 14px;
                color: #b8bdd8;
            }

            .mcp-server-description {
                font-size: 14px;
                color: #b8bdd8;
                margin-bottom: 8px;
            }

            .mcp-server-tags {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }

            .mcp-tag {
                font-size: 12px;
                padding: 4px 8px;
                background: #14151a;
                border-radius: 4px;
                color: #b8bdd8;
            }

            /* Time preferences */
            .time-preferences {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 12px;
                margin-bottom: 32px;
            }

            .time-slot {
                padding: 16px;
                background: #2a2b35;
                border: 2px solid transparent;
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.2s;
            }

            .time-slot:hover {
                border-color: #5e9eff;
            }

            .time-slot.selected {
                background: #5e9eff;
                color: white;
            }

            .time-slot-title {
                font-weight: 600;
                margin-bottom: 4px;
            }

            .time-slot-desc {
                font-size: 14px;
                opacity: 0.8;
            }

            /* Navigation buttons */
            .nav-buttons {
                display: flex;
                justify-content: space-between;
                margin-top: 40px;
            }

            .nav-btn {
                padding: 12px 24px;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
            }

            .nav-btn.back {
                background: #2a2b35;
                color: #b8bdd8;
            }

            .nav-btn.back:hover {
                background: #3a3b45;
            }

            .nav-btn.next {
                background: #5e9eff;
                color: white;
            }

            .nav-btn.next:hover {
                background: #4a8aeb;
            }

            .nav-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            /* Welcome message */
            .welcome-user {
                display: flex;
                align-items: center;
                gap: 16px;
                margin-bottom: 32px;
                padding: 20px;
                background: #2a2b35;
                border-radius: 12px;
            }

            .user-avatar {
                width: 60px;
                height: 60px;
                border-radius: 50%;
            }

            .user-info h3 {
                font-size: 20px;
                margin-bottom: 4px;
            }

            .user-info p {
                color: #b8bdd8;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div class="onboarding-container">
            <div class="onboarding-box">
                <!-- Progress bar -->
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 25%"></div>
                </div>

                <!-- Step content -->
                <div class="step-content" id="stepContent">
                    <!-- Step 1: Location -->
                    <div class="step" id="step1">
                        <h2 class="step-title">Where do you play?</h2>
                        <p class="step-description">
                            Select your primary location. You can add more locations later.
                        </p>

                        <div class="location-options" id="locationOptions">
                            <div class="location-card" data-city="vancouver">
                                <div class="city-name">Vancouver</div>
                                <div class="city-info">50+ venues</div>
                            </div>
                            <div class="location-card" data-city="burnaby">
                                <div class="city-name">Burnaby</div>
                                <div class="city-info">30+ venues</div>
                            </div>
                            <div class="location-card" data-city="richmond">
                                <div class="city-name">Richmond</div>
                                <div class="city-info">25+ venues</div>
                            </div>
                            <div class="location-card" data-city="surrey">
                                <div class="city-name">Surrey</div>
                                <div class="city-info">40+ venues</div>
                            </div>
                            <div class="location-card" data-city="northvan">
                                <div class="city-name">North Van</div>
                                <div class="city-info">20+ venues</div>
                            </div>
                            <div class="location-card" data-city="coquitlam">
                                <div class="city-name">Coquitlam</div>
                                <div class="city-info">15+ venues</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Navigation buttons -->
                <div class="nav-buttons">
                    <button class="nav-btn back" id="backBtn" onclick="previousStep()" disabled>
                        Back
                    </button>
                    <button class="nav-btn next" id="nextBtn" onclick="nextStep()" disabled>
                        Next
                    </button>
                </div>
            </div>
        </div>

        <script src="onboarding.js"></script>
    </body>
</html>
