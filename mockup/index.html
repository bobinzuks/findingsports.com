<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Finding Sports - Find Sports Near You</title>
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="stylesheet" href="css/background-enhancement.css" />
        <link rel="stylesheet" href="css/play-now.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script>
            // Google Maps API Key (replace with your own key in production)
            window.GOOGLE_MAPS_API_KEY = 'AIzaSyD2ux0PIekUQLAqVDNhy0tHwhBht6vcXqA';
            
            // Load Google Maps API
            function loadGoogleMapsScript() {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${window.GOOGLE_MAPS_API_KEY}&libraries=places&callback=onGoogleMapsReady`;
                script.async = true;
                script.defer = true;
                document.head.appendChild(script);
            }
            
            // Callback when Google Maps is ready
            window.onGoogleMapsReady = function() {
                console.log('Google Maps API loaded successfully');
                window.googleMapsLoaded = true;
                
                // Dispatch event for any waiting code
                window.dispatchEvent(new Event('googlemapsloaded'));
            };
            
            // Start loading Google Maps
            loadGoogleMapsScript();
        </script>
    </head>
    <body>
        <div class="sports-bg-pattern"></div>
        <div class="app-container">
            <!-- Header -->
            <header class="header">
                <div class="header-content">
                    <div class="logo-section">
                        <img src="images/logo2.png" alt="Finding Sports" class="logo-image" />
                        <p class="tagline">Wherever, whenever</p>
                    </div>
                    <div class="user-menu header-right">
                        <!-- User menu will be populated by JavaScript -->
                    </div>
                </div>
            </header>

            <!-- Search Section -->
            <section class="search-section">
                <div class="search-container">
                    <select class="location-select" id="locationSelect">
                        <option value="vancouver">Vancouver</option>
                        <option value="burnaby">Burnaby</option>
                        <option value="richmond">Richmond</option>
                        <option value="surrey">Surrey</option>
                    </select>

                    <select class="sport-select" id="sportSelect">
                        <option value="any">Any sport</option>
                        <option value="basketball">Basketball</option>
                        <option value="soccer">Soccer</option>
                        <option value="volleyball">Volleyball</option>
                        <option value="tennis">Tennis</option>
                        <option value="hockey">Hockey</option>
                    </select>

                    <button class="search-btn" onclick="searchGames()">Search</button>
                    <button class="play-now-btn" onclick="playNow()">Play Now</button>

                    <div
                        style="
                            text-align: center;
                            margin-top: 1rem;
                            display: flex;
                            justify-content: center;
                            gap: 2rem;
                            flex-wrap: wrap;
                        "
                    >
                        <a href="/submit-game.html" style="color: #ff6b35; text-decoration: none; font-weight: 500">
                            Submit a Drop-in Game
                        </a>
                        <a href="sport-rules.html" style="color: #f4c542; text-decoration: none; font-weight: 500">
                            Sport Rules Guide
                        </a>
                    </div>
                </div>
            </section>

            <!-- Navigation Tabs -->
            <nav class="tabs">
                <button class="tab active" onclick="switchTab('social')">Social Feed</button>
                <button class="tab" onclick="switchTab('upcoming')">Upcoming Games</button>
                <button class="tab" onclick="showRulesPage()">Sport Rules</button>
            </nav>

            <!-- Main Content Area -->
            <main class="main-content">
                <div class="content-wrapper">
                    <!-- Games List -->
                    <section class="games-section">
                        <h2 class="section-title">Games near <span id="locationName">Vancouver</span></h2>

                        <div class="games-list" id="gamesList">
                            <!-- Games will be loaded dynamically from the API -->
                        </div>

                        <!-- Join Game Section will be dynamically added when needed -->
                    </section>

                    <!-- Map Section -->
                    <section class="map-section">
                        <div id="map" class="map-container"></div>
                    </section>
                </div>
            </main>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/google-maps.js"></script>
        <script src="js/api.js"></script>
        <script src="js/websocket.js"></script>
        <script src="js/venue-search.js"></script>
        <script src="js/location-search-ui.js"></script>
        <script src="js/location-service.js"></script>
        <script src="js/play-now-service.js"></script>
        <script src="js/play-now.js"></script>
        <script src="js/drop-in-games.js"></script>
        <script src="js/social-feed.js"></script>
        <script src="js/leagues.js"></script>
        <script src="js/sport-rules.js"></script>
        <script src="js/language-service.js"></script>
        <script src="js/debug-utils.js"></script>
        <script src="js/map-debug.js"></script>
        <script src="js/map-init-fix.js"></script>
        <script src="js/app.js"></script>
        <!-- Comprehensive button handler fix -->
        <script src="js/button-handler-fix.js"></script>
    </body>
</html>
