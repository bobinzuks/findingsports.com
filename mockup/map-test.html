<body>
    <h1>Finding Sports - Map Integration Test</h1>
    
    <div id="status">
        <div class="info">Test console ready...</div>
    </div>
    
    <div class="test-section">
        <h2>Map Tests</h2>
        <button class="test-button" onclick="testGoogleMapsLoad()">Test Google Maps Load</button>
        <button class="test-button" onclick="testMapInitialization()">Test Map Init</button>
        <button class="test-button" onclick="testAddMarkers()">Test Add Markers</button>
        <button class="test-button" onclick="testDarkTheme()">Test Dark Theme</button>
        <button class="test-button" onclick="testFullApp()">Open Full App</button>
    </div>
    
    <div class="test-section">
        <h2>Map Container</h2>
        <div class="map-section">
            <div id="map" class="map-container"></div>
        </div>
    </div>
    
    <script src="js/config.js?v=1752417024232"></script>
    <script src="js/google-maps.js?v=1752417024232"></script>
    <script>
        function log(message, type = 'info') {
            const status = document.getElementById('status');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            status.appendChild(entry);
            status.scrollTop = status.scrollHeight;
        }
        
        function testGoogleMapsLoad() {
            log('Testing Google Maps API load...');
            
            if (typeof google !== 'undefined' && google.maps) {
                log('Google Maps already loaded!', 'success');
                return;
            }
            
            log('Loading Google Maps API...');
            window.loadGoogleMapsAPI(window.GOOGLE_MAPS_API_KEY)
                .then(() => {
                    log('Google Maps API loaded successfully!', 'success');
                })
                .catch(error => {
                    log('Failed to load Google Maps: ' + error.message, 'error');
                });
        }
        
        function testMapInitialization() {
            log('Testing map initialization...');
            
            const vancouver = [49.2827, -123.1207];
            window.initializeGoogleMap(vancouver);
            
            setTimeout(() => {
                if (window.googleMap) {
                    log('Map initialized successfully!', 'success');
                    log('Map center: ' + window.googleMap.getCenter().toString());
                    log('Map zoom: ' + window.googleMap.getZoom());
                } else {
                    log('Map initialization failed', 'error');
                }
            }, 1000);
        }
        
        function testAddMarkers() {
            log('Testing marker addition...');
            
            if (!window.googleMap) {
                log('Map not initialized, initializing first...', 'info');
                testMapInitialization();
                setTimeout(testAddMarkers, 2000);
                return;
            }
            
            const testGames = [
                {
                    id: 1,
                    title: 'Basketball Game',
                    type: 'basketball',
                    coords: [49.2827, -123.1207],
                    venue: { name: 'Downtown Court' },
                    attendees: 8,
                    maxAttendees: 12
                },
                {
                    id: 2,
                    title: 'Soccer Match',
                    type: 'soccer',
                    coords: [49.2684, -123.1683],
                    venue: { name: 'Kitsilano Field' },
                    attendees: 14,
                    maxAttendees: 20
                }
            ];
            
            window.clearGoogleMarkers();
            
            testGames.forEach(game => {
                window.addGoogleGameMarker(game);
                log(`Added marker for ${game.title}`, 'success');
            });
            
            window.fitMapToMarkers();
            log('Adjusted map bounds to show all markers', 'success');
        }
        
        function testDarkTheme() {
            log('Testing dark theme application...');
            
            if (!window.googleMap) {
                log('Map not initialized', 'error');
                return;
            }
            
            // Apply dark theme
            window.googleMap.setOptions({
                styles: window.darkMapStyles
            });
            
            log('Dark theme applied!', 'success');
        }
        
        function testFullApp() {
            window.open('index.html', '_blank');
        }
        
        // Load Google Maps on page load
        window.onload = function() {
            log('Page loaded, initializing Google Maps...');
            
            // Load script
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${window.GOOGLE_MAPS_API_KEY}&libraries=places&callback=onGoogleMapsReady`;
            script.async = true;
            script.defer = true;
            
            window.onGoogleMapsReady = function() {
                log('Google Maps API loaded via callback!', 'success');
                window.googleMapsLoaded = true;
                window.dispatchEvent(new Event('googlemapsloaded'));
                
                // Auto-initialize map
                setTimeout(() => {
                    testMapInitialization();
                }, 500);
            };
            
            script.onerror = function() {
                log('Failed to load Google Maps script', 'error');
            };
            
            document.head.appendChild(script);
        };
    </script>
</body>
