<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Authenticating...</title>
        <style>
            body {
                background: #14151a;
                color: #e8e9f0;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
            }

            .auth-container {
                text-align: center;
                padding: 40px;
            }

            .spinner {
                width: 50px;
                height: 50px;
                border: 3px solid #2a2b35;
                border-top-color: #5e9eff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin: 0 auto 20px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            h2 {
                margin-bottom: 10px;
                color: #e8e9f0;
            }

            p {
                color: #b8bdd8;
            }

            .error {
                color: #ff4444;
                margin-top: 20px;
            }
        </style>
    </head>
    <body>
        <div class="auth-container">
            <div class="spinner"></div>
            <h2>Authenticating with Google...</h2>
            <p>Please wait while we complete your sign-in</p>
            <div id="error" class="error" style="display: none"></div>
        </div>

        <script>
            // Handle OAuth callback
            async function handleCallback() {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const error = urlParams.get('error');

                if (error) {
                    showError('Authentication was cancelled or failed.');
                    setTimeout(() => {
                        window.location.href = '/login-google.html';
                    }, 3000);
                    return;
                }

                if (!code) {
                    showError('No authorization code received.');
                    setTimeout(() => {
                        window.location.href = '/login-google.html';
                    }, 3000);
                    return;
                }

                try {
                    // In a real implementation, this would call your backend
                    // For demo purposes, we'll simulate the auth flow
                    await simulateAuth(code);
                } catch (err) {
                    showError('Authentication failed. Please try again.');
                    setTimeout(() => {
                        window.location.href = '/login-google.html';
                    }, 3000);
                }
            }

            // Simulate authentication (replace with actual backend call)
            async function simulateAuth(code) {
                // Simulate network delay
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Create mock user data from Google
                const mockUser = {
                    id: 'google-' + Math.random().toString(36).substr(2, 9),
                    email: 'user@gmail.com',
                    name: 'Google User',
                    picture: 'https://lh3.googleusercontent.com/a/default-user=s96-c',
                    provider: 'google',
                    isNew: true
                };

                // Store auth data
                localStorage.setItem('authToken', 'mock-jwt-token-' + Date.now());
                localStorage.setItem('currentUser', JSON.stringify(mockUser));

                // Redirect to onboarding for new users
                if (mockUser.isNew) {
                    window.location.href = '/onboarding/';
                } else {
                    window.location.href = '/';
                }
            }

            function showError(message) {
                const errorDiv = document.getElementById('error');
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
            }

            // Start the callback handling
            handleCallback();
        </script>
    </body>
</html>
