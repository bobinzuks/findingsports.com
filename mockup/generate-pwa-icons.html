<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate PWA Icons</title>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>This page generates PWA icons for Finding Sports. Right-click and save each canvas as a PNG file.</p>
    
    <div id="icons"></div>
    
    <script>
        // Icon sizes needed for PWA
        const sizes = [72, 96, 128, 144, 152, 192, 256, 384, 512];
        
        sizes.forEach(size => {
            // Create canvas
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(0, 0, size, size);
            
            // Draw sports icon pattern
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${size * 0.4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Sports emoji as icon
            ctx.fillText('🏀', size / 2, size / 2);
            
            // Add text for larger icons
            if (size >= 192) {
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${size * 0.12}px Arial`;
                ctx.fillText('FINDING', size / 2, size * 0.75);
                ctx.fillText('SPORTS', size / 2, size * 0.85);
            }
            
            // Add label
            const container = document.createElement('div');
            container.style.margin = '20px';
            container.style.display = 'inline-block';
            
            const label = document.createElement('p');
            label.textContent = `icon-${size}x${size}.png`;
            
            container.appendChild(canvas);
            container.appendChild(label);
            document.getElementById('icons').appendChild(container);
        });
        
        // Generate maskable icon (with safe zone)
        const maskableCanvas = document.createElement('canvas');
        maskableCanvas.width = 512;
        maskableCanvas.height = 512;
        const mctx = maskableCanvas.getContext('2d');
        
        // Background with extra padding for maskable
        mctx.fillStyle = '#f39c12';
        mctx.fillRect(0, 0, 512, 512);
        
        // Safe zone circle (80% of icon)
        mctx.strokeStyle = '#e67e22';
        mctx.lineWidth = 2;
        mctx.setLineDash([5, 5]);
        mctx.beginPath();
        mctx.arc(256, 256, 204, 0, 2 * Math.PI);
        mctx.stroke();
        
        // Icon in safe zone
        mctx.fillStyle = '#ffffff';
        mctx.font = 'bold 160px Arial';
        mctx.textAlign = 'center';
        mctx.textBaseline = 'middle';
        mctx.fillText('🏀', 256, 230);
        
        mctx.font = 'bold 48px Arial';
        mctx.fillText('FINDING', 256, 340);
        mctx.fillText('SPORTS', 256, 390);
        
        const maskableContainer = document.createElement('div');
        maskableContainer.style.margin = '20px';
        maskableContainer.style.display = 'inline-block';
        
        const maskableLabel = document.createElement('p');
        maskableLabel.textContent = 'icon-512x512-maskable.png (with safe zone guide)';
        
        maskableContainer.appendChild(maskableCanvas);
        maskableContainer.appendChild(maskableLabel);
        document.getElementById('icons').appendChild(maskableContainer);
        
        // Instructions
        const instructions = document.createElement('div');
        instructions.style.margin = '20px';
        instructions.style.padding = '20px';
        instructions.style.background = '#f5f5f5';
        instructions.style.border = '1px solid #ddd';
        instructions.innerHTML = `
            <h2>Instructions:</h2>
            <ol>
                <li>Right-click on each canvas above</li>
                <li>Select "Save image as..."</li>
                <li>Save with the filename shown below each icon</li>
                <li>Place all icons in the /images/ directory</li>
                <li>The dotted circle on the maskable icon shows the safe zone</li>
            </ol>
            <p><strong>Note:</strong> The maskable icon should be saved without the dotted guide circle. 
            It's just shown here to indicate the safe zone for adaptive icons.</p>
        `;
        document.body.appendChild(instructions);
    </script>
</body>
</html>
