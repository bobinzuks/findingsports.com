<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test API v2 Games</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .game-card {
            background: #f9f9f9;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .error {
            color: red;
            padding: 10px;
            background: #ffe6e6;
            border-radius: 4px;
        }
        .success {
            color: green;
            padding: 10px;
            background: #e6ffe6;
            border-radius: 4px;
        }
        .loading {
            color: blue;
            padding: 10px;
            background: #e6f3ff;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Testing API v2 Games Endpoint</h1>
        
        <button onclick="testLocalAPI()">Test Local API (Port 8080)</button>
        <button onclick="testMockData()">Test with Mock Data</button>
        
        <h2>API Response:</h2>
        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script>
        // Test local API
        async function testLocalAPI() {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            
            status.innerHTML = '<div class="loading">Loading from API v2...</div>';
            results.innerHTML = '';
            
            try {
                const response = await fetch('http://localhost:8080/api/v2/games');
                const data = await response.json();
                
                if (response.ok) {
                    status.innerHTML = `<div class="success">Success! Found ${data.games?.length || 0} games</div>`;
                    displayGames(data.games || []);
                } else {
                    throw new Error(`API Error: ${data.error || response.statusText}`);
                }
            } catch (error) {
                status.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                
                // Try alternative endpoints
                tryAlternativeEndpoints();
            }
        }
        
        // Try alternative endpoints
        async function tryAlternativeEndpoints() {
            const endpoints = [
                '/api/games',
                '/api/play-now',
                '/api/v2/games',
                'http://localhost:8080/api/games',
                'http://localhost:8080/api/play-now'
            ];
            
            const results = document.getElementById('results');
            results.innerHTML = '<h3>Trying alternative endpoints...</h3>';
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(endpoint);
                    const data = await response.json();
                    
                    if (response.ok) {
                        results.innerHTML += `<div class="success">✓ ${endpoint} - ${JSON.stringify(data).slice(0, 100)}...</div>`;
                    } else {
                        results.innerHTML += `<div class="error">✗ ${endpoint} - ${response.status}</div>`;
                    }
                } catch (error) {
                    results.innerHTML += `<div class="error">✗ ${endpoint} - ${error.message}</div>`;
                }
            }
        }
        
        // Display games
        function displayGames(games) {
            const results = document.getElementById('results');
            
            if (games.length === 0) {
                results.innerHTML = '<div class="error">No games found</div>';
                return;
            }
            
            results.innerHTML = '<h3>Games:</h3>' + games.map(game => `
                <div class="game-card">
                    <h4>${game.sport || 'Unknown Sport'}</h4>
                    <p><strong>Venue:</strong> ${game.venue?.name || game.venue || 'TBD'}</p>
                    <p><strong>Time:</strong> ${game.startTime || game.time || 'TBD'}</p>
                    <p><strong>Players:</strong> ${game.currentPlayers || 0}/${game.maxPlayers || '?'}</p>
                    ${game.address ? `<p><strong>Address:</strong> ${game.address}</p>` : ''}
                </div>
            `).join('');
        }

        // Test on load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, testing mock data first...');
            testMockData();
        });
    </script>
</body>
</html>
