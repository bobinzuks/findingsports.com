<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Google Maps Test - Finding Sports</title>
        <link rel="stylesheet" href="css/styles.css" />
        <style>
            body {
                margin: 0;
                padding: 20px;
                background: #000;
                color: #faf5e9;
                font-family: 'Oswald', Arial, sans-serif;
            }
            .test-container {
                max-width: 1200px;
                margin: 0 auto;
            }
            .info {
                margin-bottom: 20px;
                background: rgba(26, 26, 26, 0.8);
                padding: 20px;
                border-radius: 8px;
                border: 1px solid rgba(244, 197, 66, 0.3);
            }
            .status {
                font-weight: bold;
                margin: 10px 0;
            }
            .success {
                color: #4CAF50;
            }
            .error {
                color: #ff4444;
            }
            .warning {
                color: #f4c542;
            }
            #test-map {
                width: 100%;
                height: 600px;
                border: 2px solid #f4c542;
                border-radius: 12px;
                background: #1a1a1a;
                position: relative;
            }
            .controls {
                margin-top: 20px;
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }
            .btn {
                padding: 10px 20px;
                background: linear-gradient(135deg, #ff6b35 0%, #f4c542 100%);
                border: none;
                border-radius: 6px;
                color: #000;
                font-weight: 600;
                cursor: pointer;
                text-transform: uppercase;
            }
            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
            }
            .log {
                margin-top: 20px;
                background: rgba(0, 0, 0, 0.5);
                padding: 15px;
                border-radius: 8px;
                font-family: monospace;
                font-size: 0.9em;
                max-height: 200px;
                overflow-y: auto;
            }
        </style>
    </head>
    <body>
        <div class="test-container">
            <div class="info">
                <h1>Google Maps Dark Theme Test</h1>
                <p>This page tests the Google Maps integration with dark theme styling for Finding Sports.</p>
                <div id="status" class="status">Initializing...</div>
                <div id="api-status" class="status"></div>
            </div>

            <div id="test-map"></div>

            <div class="controls">
                <button class="btn" onclick="addTestMarkers()">Add Test Markers</button>
                <button class="btn" onclick="clearMarkers()">Clear Markers</button>
                <button class="btn" onclick="toggleMapType()">Toggle Map Type</button>
                <button class="btn" onclick="testInfoWindow()">Test Info Window</button>
                <button class="btn" onclick="simulateUserLocation()">Simulate User Location</button>
            </div>

            <div class="log" id="log">
                <strong>Event Log:</strong><br>
            </div>
        </div>

        <script>
            // Set API key
            window.GOOGLE_MAPS_API_KEY = 'AIzaSyBqVDmKw7sY5lqqOJlk1b5cMYjCXf-xlG4';
        </script>
        <script src="js/config.js"></script>
        <script src="js/google-maps.js"></script>
        <script>
            let testMap = null;
            let testMarkers = [];

            function log(message, type = 'info') {
                const logEl = document.getElementById('log');
                const time = new Date().toLocaleTimeString();
                const color = type === 'error' ? '#ff4444' : type === 'success' ? '#4CAF50' : '#faf5e9';
                logEl.innerHTML += `<span style="color: ${color}">[${time}] ${message}</span><br>`;
                logEl.scrollTop = logEl.scrollHeight;
            }

            function updateStatus(message, type = 'info') {
                const statusEl = document.getElementById('status');
                statusEl.textContent = message;
                statusEl.className = 'status ' + type;
            }

            // Initialize map
            async function initTestMap() {
                try {
                    updateStatus('Loading Google Maps API...', 'warning');
                    
                    if (window.loadGoogleMapsAPI) {
                        await window.loadGoogleMapsAPI(window.GOOGLE_MAPS_API_KEY);
                        updateStatus('Google Maps API loaded successfully!', 'success');
                        document.getElementById('api-status').textContent = 'API Status: Loaded';
                        document.getElementById('api-status').className = 'status success';
                        
                        // Initialize map with Vancouver coordinates
                        window.initializeGoogleMap([49.2827, -123.1207], 'test-map');
                        testMap = window.googleMap;
                        
                        if (testMap) {
                            log('Map initialized successfully', 'success');
                            updateStatus('Map ready! Try the controls below.', 'success');
                        } else {
                            throw new Error('Map initialization failed');
                        }
                    } else {
                        throw new Error('Google Maps module not loaded');
                    }
                } catch (error) {
                    updateStatus('Error: ' + error.message, 'error');
                    log('Failed to initialize map: ' + error.message, 'error');
                    console.error('Map initialization error:', error);
                }
            }

            function addTestMarkers() {
                const testGames = [
                    {
                        title: 'Basketball at Kitsilano Beach',
                        type: 'basketball',
                        coords: [49.2684, -123.1683],
                        attendees: 8,
                        maxAttendees: 10,
                        venue: { name: 'Kitsilano Beach Courts' }
                    },
                    {
                        title: 'Soccer at UBC',
                        type: 'soccer',
                        coords: [49.2606, -123.246],
                        attendees: 14,
                        maxAttendees: 20,
                        venue: { name: 'UBC Sports Fields' }
                    },
                    {
                        title: 'Volleyball Downtown',
                        type: 'volleyball',
                        coords: [49.2827, -123.1207],
                        attendees: 6,
                        maxAttendees: 12,
                        venue: { name: 'Downtown Community Center' }
                    }
                ];

                testGames.forEach(game => {
                    window.addGoogleGameMarker(game);
                });

                window.fitMapToMarkers();
                log(`Added ${testGames.length} test markers`, 'success');
            }

            function clearMarkers() {
                window.clearGoogleMarkers();
                log('Cleared all markers', 'success');
            }

            function toggleMapType() {
                if (!testMap) return;
                
                const currentType = testMap.getMapTypeId();
                const newType = currentType === 'roadmap' ? 'satellite' : 'roadmap';
                testMap.setMapTypeId(newType);
                log(`Switched map type to ${newType}`, 'success');
            }

            function testInfoWindow() {
                if (!testMap) return;
                
                const infoWindow = new google.maps.InfoWindow({
                    content: `
                        <div style="padding: 10px;">
                            <h3 style="margin: 0 0 10px 0; color: #ff6b35;">Test Info Window</h3>
                            <p style="margin: 5px 0;">This tests the dark theme styling</p>
                            <button style="padding: 5px 10px; background: #ff6b35; color: white; border: none; border-radius: 4px;">
                                Join Game
                            </button>
                        </div>
                    `,
                    position: testMap.getCenter()
                });
                
                infoWindow.open(testMap);
                log('Opened test info window', 'success');
            }

            function simulateUserLocation() {
                const userLoc = [49.2827, -123.1207];
                window.initializeGoogleMap(userLoc, 'test-map');
                log('Added user location marker', 'success');
            }

            // Initialize on page load
            window.addEventListener('load', initTestMap);
        </script>
    </body>
</html>
