<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test All Buttons - Finding Sports</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #0a1628;
            color: #cdd6f4;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background-color: #1e293b;
            border-radius: 8px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            background-color: #2a3f5f;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        button {
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background-color: #1976D2;
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #ff6b6b;
        }
        .warning {
            color: #ff9800;
        }
        h2 {
            color: #64b5f6;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Finding Sports - Button & Functionality Test Suite</h1>
        
        <div class="test-section">
            <h2>1. Navigation Buttons Test</h2>
            <div class="button-grid">
                <button onclick="testNavigation('play-now')">Test Play Now Tab</button>
                <button onclick="testNavigation('drop-in')">Test Drop-in Tab</button>
                <button onclick="testNavigation('social')">Test Social Tab</button>
                <button onclick="testNavigation('leagues')">Test Leagues Tab</button>
            </div>
            <div id="nav-result" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>2. Search & Filter Functions</h2>
            <div class="button-grid">
                <button onclick="testSearch()">Test Search Function</button>
                <button onclick="testPlayNowButton()">Test Play Now Button</button>
                <button onclick="testLocationSelect()">Test Location Select</button>
                <button onclick="testSportFilter()">Test Sport Filter</button>
            </div>
            <div id="search-result" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>3. API Endpoints Test</h2>
            <div class="button-grid">
                <button onclick="testAPI('/api/games')">Test Games API</button>
                <button onclick="testAPI('/api/play-now?lat=49.2827&lng=-123.1207&radius=10')">Test Play Now API</button>
                <button onclick="testAPI('/api/drop-in-games')">Test Drop-in API</button>
                <button onclick="testAPI('/api/fields/status')">Test Fields API</button>
            </div>
            <div id="api-result" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>4. Map Functions Test</h2>
            <div class="button-grid">
                <button onclick="testMapInit()">Test Map Initialization</button>
                <button onclick="testMapMarkers()">Test Map Markers</button>
                <button onclick="testLocationDetection()">Test Location Detection</button>
            </div>
            <div id="map-result" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>5. User Interaction Test</h2>
            <div class="button-grid">
                <button onclick="testGameCardClick()">Test Game Card Click</button>
                <button onclick="testVenueSearch()">Test Venue Search</button>
                <button onclick="testSubmitGame()">Test Submit Game</button>
            </div>
            <div id="interaction-result" class="test-result"></div>
        </div>

        <div class="test-section">
            <h2>Test Summary</h2>
            <div id="summary-result" class="test-result"></div>
        </div>
    </div>

    <!-- Load all required scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/location-service.js"></script>
    <script src="js/play-now.js"></script>
    <script src="js/drop-in-games.js"></script>
    <script src="js/social-feed.js"></script>
    <script src="js/leagues.js"></script>
    <script src="js/app.js"></script>

    <script>
        let testResults = {
            passed: 0,
            failed: 0,
            warnings: 0
        };

        function updateResult(elementId, message, status = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const statusClass = status === 'success' ? 'success' : status === 'error' ? 'error' : status === 'warning' ? 'warning' : '';
            
            element.innerHTML += `[${timestamp}] <span class="${statusClass}">${message}</span>\n`;
            
            if (status === 'success') testResults.passed++;
            else if (status === 'error') testResults.failed++;
            else if (status === 'warning') testResults.warnings++;
            
            updateSummary();
        }

        function updateSummary() {
            const summary = document.getElementById('summary-result');
            summary.innerHTML = `
Tests Passed: <span class="success">${testResults.passed}</span>
Tests Failed: <span class="error">${testResults.failed}</span>
Warnings: <span class="warning">${testResults.warnings}</span>
Total Tests: ${testResults.passed + testResults.failed}
            `;
        }

        // Test Navigation
        async function testNavigation(page) {
            try {
                updateResult('nav-result', `Testing navigation to ${page}...`);
                
                if (!window.switchPage) {
                    throw new Error('switchPage function not found');
                }
                
                await window.switchPage(page);
                
                // Check if page content was rendered
                const contentWrapper = document.querySelector('.content-wrapper');
                if (!contentWrapper) {
                    throw new Error('Content wrapper not found');
                }
                
                updateResult('nav-result', `✓ Successfully navigated to ${page}`, 'success');
            } catch (error) {
                updateResult('nav-result', `✗ Navigation to ${page} failed: ${error.message}`, 'error');
            }
        }

        // Test Search Function
        async function testSearch() {
            try {
                updateResult('search-result', 'Testing search function...');
                
                if (!window.searchGames) {
                    throw new Error('searchGames function not found');
                }
                
                // Create mock elements if needed
                if (!document.getElementById('locationSelect')) {
                    const select = document.createElement('select');
                    select.id = 'locationSelect';
                    select.value = 'vancouver';
                    document.body.appendChild(select);
                }
                
                if (!document.getElementById('sportSelect')) {
                    const select = document.createElement('select');
                    select.id = 'sportSelect';
                    select.value = 'any';
                    document.body.appendChild(select);
                }
                
                await window.searchGames();
                updateResult('search-result', '✓ Search function executed successfully', 'success');
            } catch (error) {
                updateResult('search-result', `✗ Search function failed: ${error.message}`, 'error');
            }
        }

        // Test Play Now Button
        async function testPlayNowButton() {
            try {
                updateResult('search-result', 'Testing Play Now button...');
                
                if (!window.playNow) {
                    throw new Error('playNow function not found');
                }
                
                await window.playNow();
                
                // Check if we switched to play-now page
                if (window.currentPage === 'play-now') {
                    updateResult('search-result', '✓ Play Now button works correctly', 'success');
                } else {
                    updateResult('search-result', '⚠ Play Now executed but page not switched', 'warning');
                }
            } catch (error) {
                updateResult('search-result', `✗ Play Now button failed: ${error.message}`, 'error');
            }
        }

        // Test Location Select
        function testLocationSelect() {
            try {
                updateResult('search-result', 'Testing location select...');
                
                const locationSelect = document.getElementById('locationSelect');
                if (!locationSelect) {
                    throw new Error('Location select not found');
                }
                
                const locations = ['vancouver', 'burnaby', 'richmond', 'surrey'];
                let allWork = true;
                
                locations.forEach(loc => {
                    locationSelect.value = loc;
                    if (locationSelect.value !== loc) {
                        allWork = false;
                    }
                });
                
                if (allWork) {
                    updateResult('search-result', '✓ Location select works correctly', 'success');
                } else {
                    updateResult('search-result', '✗ Location select not functioning properly', 'error');
                }
            } catch (error) {
                updateResult('search-result', `✗ Location select test failed: ${error.message}`, 'error');
            }
        }

        // Test Sport Filter
        function testSportFilter() {
            try {
                updateResult('search-result', 'Testing sport filter...');
                
                const sportSelect = document.getElementById('sportSelect');
                if (!sportSelect) {
                    throw new Error('Sport select not found');
                }
                
                const sports = ['any', 'basketball', 'soccer', 'volleyball'];
                let allWork = true;
                
                sports.forEach(sport => {
                    sportSelect.value = sport;
                    if (sportSelect.value !== sport) {
                        allWork = false;
                    }
                });
                
                if (allWork) {
                    updateResult('search-result', '✓ Sport filter works correctly', 'success');
                } else {
                    updateResult('search-result', '✗ Sport filter not functioning properly', 'error');
                }
            } catch (error) {
                updateResult('search-result', `✗ Sport filter test failed: ${error.message}`, 'error');
            }
        }

        // Test API Endpoints
        async function testAPI(endpoint) {
            try {
                updateResult('api-result', `Testing API endpoint: ${endpoint}...`);
                
                const apiBase = window.APP_CONFIG?.API_BASE_URL || 'http://localhost:8080';
                const url = `${apiBase}${endpoint}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (response.ok) {
                    updateResult('api-result', `✓ ${endpoint} - Status: ${response.status}, Data received`, 'success');
                } else {
                    updateResult('api-result', `✗ ${endpoint} - Status: ${response.status}`, 'error');
                }
            } catch (error) {
                updateResult('api-result', `✗ ${endpoint} failed: ${error.message}`, 'error');
            }
        }

        // Test Map Initialization
        function testMapInit() {
            try {
                updateResult('map-result', 'Testing map initialization...');
                
                if (window.map || window.googleMap) {
                    updateResult('map-result', '✓ Map is initialized', 'success');
                } else {
                    updateResult('map-result', '⚠ Map not initialized, attempting to initialize...', 'warning');
                    
                    // Create map container if needed
                    if (!document.getElementById('map')) {
                        const mapDiv = document.createElement('div');
                        mapDiv.id = 'map';
                        mapDiv.style.height = '400px';
                        document.body.appendChild(mapDiv);
                    }
                    
                    window.initializeMap();
                    updateResult('map-result', '✓ Map initialization attempted', 'success');
                }
            } catch (error) {
                updateResult('map-result', `✗ Map initialization failed: ${error.message}`, 'error');
            }
        }

        // Test Map Markers
        function testMapMarkers() {
            try {
                updateResult('map-result', 'Testing map markers...');
                
                if (!window.addGameMarker) {
                    throw new Error('addGameMarker function not found');
                }
                
                // Test adding a marker
                const testGame = {
                    id: 'test-1',
                    type: 'basketball',
                    title: 'Test Game',
                    venue: { name: 'Test Venue', coordinates: { lat: 49.2827, lng: -123.1207 } },
                    coords: [49.2827, -123.1207]
                };
                
                window.addGameMarker(testGame);
                updateResult('map-result', '✓ Map marker function works', 'success');
            } catch (error) {
                updateResult('map-result', `✗ Map marker test failed: ${error.message}`, 'error');
            }
        }

        // Test Location Detection
        async function testLocationDetection() {
            try {
                updateResult('map-result', 'Testing location detection...');
                
                if (!window.locationService) {
                    updateResult('map-result', '⚠ Location service not initialized', 'warning');
                    await window.initializeLocationDetection();
                }
                
                const locationInfo = window.locationService?.getLocationInfo();
                if (locationInfo) {
                    updateResult('map-result', `✓ Location detected: ${JSON.stringify(locationInfo.currentCity)}`, 'success');
                } else {
                    updateResult('map-result', '✗ Location detection failed', 'error');
                }
            } catch (error) {
                updateResult('map-result', `✗ Location detection error: ${error.message}`, 'error');
            }
        }

        // Test Game Card Click
        function testGameCardClick() {
            try {
                updateResult('interaction-result', 'Testing game card click...');
                
                if (!window.showGameDetails) {
                    throw new Error('showGameDetails function not found');
                }
                
                const testGame = {
                    id: 'test-1',
                    title: 'Test Basketball Game',
                    type: 'basketball',
                    venue: { name: 'Test Venue' },
                    attendees: 5
                };
                
                window.showGameDetails(testGame);
                updateResult('interaction-result', '✓ Game card click handler works', 'success');
            } catch (error) {
                updateResult('interaction-result', `✗ Game card click failed: ${error.message}`, 'error');
            }
        }

        // Test Venue Search
        function testVenueSearch() {
            try {
                updateResult('interaction-result', 'Testing venue search...');
                
                if (!window.api || !window.api.searchVenues) {
                    throw new Error('Venue search API not found');
                }
                
                updateResult('interaction-result', '✓ Venue search function available', 'success');
            } catch (error) {
                updateResult('interaction-result', `✗ Venue search test failed: ${error.message}`, 'error');
            }
        }

        // Test Submit Game
        function testSubmitGame() {
            try {
                updateResult('interaction-result', 'Testing submit game link...');
                
                const submitLink = document.querySelector('a[href*="submit-game"]');
                if (submitLink) {
                    updateResult('interaction-result', '✓ Submit game link exists', 'success');
                } else {
                    updateResult('interaction-result', '⚠ Submit game link not found in current view', 'warning');
                }
            } catch (error) {
                updateResult('interaction-result', `✗ Submit game test failed: ${error.message}`, 'error');
            }
        }

        // Initialize on load
        window.onload = () => {
            updateResult('summary-result', 'Test suite initialized. Click buttons to run tests.');
            
            // Mock some required elements
            if (!document.querySelector('.content-wrapper')) {
                const wrapper = document.createElement('div');
                wrapper.className = 'content-wrapper';
                document.body.appendChild(wrapper);
            }
        };
    </script>
</body>
</html>
