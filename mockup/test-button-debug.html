<!DOCTYPE html>
<html lang="en">
<head>
        <!-- Deployment timestamp: 2025-07-13T14:30:24.298Z - Cache busted version 1752417024232 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .button-test {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .search-btn {
            background: #007bff;
            color: white;
        }
        .play-now-btn {
            background: #ff6b35;
            color: white;
        }
        .rules-btn {
            background: #28a745;
            color: white;
        }
        .log {
            background: #222;
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status {
            padding: 5px 10px;
            border-radius: 3px;
            margin: 5px 0;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.warning {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <h1>Finding Sports Button Debug Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Direct Function Calls</h2>
        <div class="button-test">
            <button onclick="testSearchGames()">Test searchGames()</button>
            <button onclick="testPlayNow()">Test playNow()</button>
            <button onclick="testShowRulesPage()">Test showRulesPage()</button>
        </div>
        <div id="test1-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Actual Button HTML</h2>
        <div class="button-test">
            <button class="search-btn" onclick="searchGames()">Search</button>
            <button class="play-now-btn" onclick="playNow()">Play Now</button>
            <button class="rules-btn" onclick="showRulesPage()">Sport Rules</button>
        </div>
        <div id="test2-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Function Availability</h2>
        <button onclick="checkFunctions()">Check All Functions</button>
        <div id="function-status"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Script Loading Order</h2>
        <button onclick="checkScriptOrder()">Check Script Order</button>
        <div id="script-order"></div>
    </div>

    <div class="test-section">
        <h2>Console Log</h2>
        <div id="console-log" class="log"></div>
    </div>

    <script>
        // Override console.log to capture output
        const logDiv = document.getElementById('console-log');
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            logDiv.innerHTML += '[LOG] ' + args.join(' ') + '\n';
            logDiv.scrollTop = logDiv.scrollHeight;
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            logDiv.innerHTML += '[ERROR] ' + args.join(' ') + '\n';
            logDiv.scrollTop = logDiv.scrollHeight;
        };

        // Test functions
        function testSearchGames() {
            const resultDiv = document.getElementById('test1-result');
            try {
                if (typeof searchGames === 'function') {
                    resultDiv.innerHTML = '<div class="status success">✓ searchGames is defined and callable</div>';
                    console.log('Calling searchGames()...');
                    searchGames();
                } else {
                    resultDiv.innerHTML = '<div class="status error">✗ searchGames is not defined</div>';
                }
            } catch (e) {
                resultDiv.innerHTML = '<div class="status error">✗ Error: ' + e.message + '</div>';
                console.error('searchGames error:', e);
            }
        }

        function testPlayNow() {
            const resultDiv = document.getElementById('test1-result');
            try {
                if (typeof playNow === 'function') {
                    resultDiv.innerHTML = '<div class="status success">✓ playNow is defined and callable</div>';
                    console.log('Calling playNow()...');
                    playNow();
                } else {
                    resultDiv.innerHTML = '<div class="status error">✗ playNow is not defined</div>';
                }
            } catch (e) {
                resultDiv.innerHTML = '<div class="status error">✗ Error: ' + e.message + '</div>';
                console.error('playNow error:', e);
            }
        }

        function testShowRulesPage() {
            const resultDiv = document.getElementById('test1-result');
            try {
                if (typeof showRulesPage === 'function') {
                    resultDiv.innerHTML = '<div class="status success">✓ showRulesPage is defined and callable</div>';
                    console.log('Calling showRulesPage()...');
                    showRulesPage();
                } else {
                    resultDiv.innerHTML = '<div class="status error">✗ showRulesPage is not defined</div>';
                }
            } catch (e) {
                resultDiv.innerHTML = '<div class="status error">✗ Error: ' + e.message + '</div>';
                console.error('showRulesPage error:', e);
            }
        }

        function checkFunctions() {
            const statusDiv = document.getElementById('function-status');
            const functions = [
                'searchGames',
                'playNow',
                'showRulesPage',
                'switchTab',
                'goBack',
                'goToLogin',
                'goToSubmitGame',
                'updateActiveTab',
                'createRulesSection',
                'getSportRules'
            ];
            
            let html = '<h3>Function Status:</h3>';
            functions.forEach(fn => {
                const isDefined = typeof window[fn] !== 'undefined';
                const isFunction = typeof window[fn] === 'function';
                
                if (isFunction) {
                    html += `<div class="status success">✓ ${fn}: function</div>`;
                } else if (isDefined) {
                    html += `<div class="status warning">⚠ ${fn}: ${typeof window[fn]}</div>`;
                } else {
                    html += `<div class="status error">✗ ${fn}: undefined</div>`;
                }
            });
            
            statusDiv.innerHTML = html;
        }

        function checkScriptOrder() {
            const orderDiv = document.getElementById('script-order');
            const scripts = document.querySelectorAll('script[src]');
            
            let html = '<h3>Scripts Loaded:</h3>';
            scripts.forEach((script, index) => {
                html += `<div class="status success">${index + 1}. ${script.src}</div>`;
            });
            
            // Check for inline scripts
            const inlineScripts = document.querySelectorAll('script:not([src])');
            html += `<div class="status warning">Inline scripts: ${inlineScripts.length}</div>`;
            
            orderDiv.innerHTML = html;
        }

        // Load the actual scripts from the main page
        console.log('Loading Finding Sports scripts...');
        
        // Load all the required scripts in order
        const scriptsToLoad = [
            'js/config.js',
            'js/google-maps.js',
            'js/api.js',
            'js/websocket.js',
            'js/venue-search.js',
            'js/location-search-ui.js',
            'js/location-service.js',
            'js/play-now-service.js',
            'js/play-now.js',
            'js/drop-in-games.js',
            'js/social-feed.js',
            'js/leagues.js',
            'js/sport-rules.js',
            'js/language-service.js',
            'js/global-functions.js',
            'js/main-page-fix.js',
            'js/debug-utils.js',
            'js/map-debug.js',
            'js/map-init-fix.js',
            'js/app.js',
            '../fix-play-now.js',
            'js/button-fix.js'
        ];

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load ${src}`));
                document.body.appendChild(script);
            });
        }

        async function loadAllScripts() {
            for (const src of scriptsToLoad) {
                try {
                    await loadScript(src);
                    console.log(`Loaded: ${src}`);
                } catch (e) {
                    console.error(`Failed to load: ${src}`, e);
                }
            }
            
            console.log('All scripts loaded. Checking functions...');
            setTimeout(checkFunctions, 1000);
        }

        // Start loading scripts
        loadAllScripts();
    </script>
</body>
</html>
