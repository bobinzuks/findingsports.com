<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Social Feed Mobile Test - Finding Sports</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/social-feed-enhanced.css" />
    <link rel="stylesheet" href="css/social-feed-mobile.css" />
    <link rel="stylesheet" href="css/dark-mode-button.css" />
    
    <style>
        /* Mobile test specific styles */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #36393f;
        }
        
        .mobile-test-header {
            background: #202225;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding-top: calc(16px + env(safe-area-inset-top));
        }
        
        .content-wrapper {
            margin-top: 60px;
            height: calc(100vh - 60px);
            overflow: hidden;
        }
        
        .discord-container {
            height: 100%;
            border-radius: 0;
        }
        
        /* Force mobile view */
        .social-feed-mobile .discord-sidebar,
        .social-feed-mobile .discord-users-sidebar {
            display: none !important;
        }
        
        .social-feed-mobile .discord-main {
            width: 100%;
            padding-bottom: 120px;
        }
        
        /* Demo device frame */
        .device-frame {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            padding: 10px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: none;
        }
        
        .device-screen {
            width: 100%;
            height: 100%;
            background: #36393f;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
        }
        
        /* Show device frame on desktop */
        @media (min-width: 768px) {
            body {
                background: #1a1a1a;
            }
            
            .device-frame {
                display: block;
            }
            
            .mobile-test-header,
            .content-wrapper {
                position: absolute;
                width: 375px;
                left: 50%;
                transform: translateX(-50%);
            }
            
            .content-wrapper {
                height: calc(812px - 60px);
            }
        }
        
        /* Test controls */
        .test-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 16px;
            border-radius: 8px;
            z-index: 10000;
            display: none;
        }
        
        @media (min-width: 768px) {
            .test-controls {
                display: block;
            }
        }
        
        .test-button {
            display: block;
            width: 100%;
            padding: 8px 16px;
            margin: 4px 0;
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .test-button:hover {
            background: #4752c4;
        }
    </style>
</head>
<body class="social-feed-mobile">
    <!-- Device Frame (visible on desktop) -->
    <div class="device-frame">
        <div class="device-screen">
            <!-- Mobile Header -->
            <div class="mobile-test-header">
                FindingSports Chat
            </div>
            
            <!-- Content -->
            <div class="content-wrapper">
                <!-- Social Feed will be rendered here -->
            </div>
        </div>
    </div>
    
    <!-- Test Controls (desktop only) -->
    <div class="test-controls">
        <h3>Mobile Test Controls</h3>
        <button class="test-button" onclick="simulateSwipeLeft()">Simulate Swipe Left</button>
        <button class="test-button" onclick="simulateSwipeRight()">Simulate Swipe Right</button>
        <button class="test-button" onclick="simulatePullToRefresh()">Simulate Pull to Refresh</button>
        <button class="test-button" onclick="simulateLongPress()">Simulate Long Press</button>
        <button class="test-button" onclick="toggleOrientation()">Toggle Orientation</button>
        <button class="test-button" onclick="simulateLowBattery()">Simulate Low Battery</button>
    </div>
    
    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/social-feed.js"></script>
    <script src="js/social-feed-mobile.js"></script>
    
    <script>
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Force mobile mode
            document.body.classList.add('social-feed-mobile');
            
            // Initialize social feed
            await window.SocialFeedPage.initialize();
            window.SocialFeedPage.render();
        });
        
        // Test functions
        function simulateSwipeLeft() {
            const current = window.SocialFeedMobile.touchState.currentTab;
            if (current < 2) {
                window.SocialFeedMobile.switchToTab(current + 1);
            }
        }
        
        function simulateSwipeRight() {
            const current = window.SocialFeedMobile.touchState.currentTab;
            if (current > 0) {
                window.SocialFeedMobile.switchToTab(current - 1);
            }
        }
        
        function simulatePullToRefresh() {
            const indicator = document.querySelector('.mobile-refresh-indicator');
            if (indicator) {
                indicator.classList.add('pulling');
                setTimeout(() => {
                    indicator.classList.remove('pulling');
                    indicator.classList.add('refreshing');
                    
                    setTimeout(() => {
                        indicator.classList.remove('refreshing');
                        window.SocialFeedMobile.showToast('Content refreshed!');
                    }, 1500);
                }, 500);
            }
        }
        
        function simulateLongPress() {
            const messages = document.querySelectorAll('.discord-message');
            if (messages.length > 0) {
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                window.SocialFeedMobile.showMessageOptions(randomMessage);
            }
        }
        
        function toggleOrientation() {
            const frame = document.querySelector('.device-frame');
            if (frame) {
                if (frame.style.transform.includes('rotate')) {
                    frame.style.transform = 'translate(-50%, -50%)';
                    frame.style.width = '375px';
                    frame.style.height = '812px';
                } else {
                    frame.style.transform = 'translate(-50%, -50%) rotate(90deg)';
                    frame.style.width = '812px';
                    frame.style.height = '375px';
                }
            }
        }
        
        function simulateLowBattery() {
            document.body.classList.add('reduce-motion');
            window.SocialFeedMobile.showToast('Low battery mode activated');
            
            setTimeout(() => {
                document.body.classList.remove('reduce-motion');
                window.SocialFeedMobile.showToast('Normal mode restored');
            }, 5000);
        }
    </script>
</body>
</html>
