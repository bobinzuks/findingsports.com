<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Hub - Finding Sports</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/community-reputation.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Finding Sports</a>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="play-now.html" class="nav-link">Play Now</a>
                <a href="social-feed.html" class="nav-link">Social Feed</a>
                <a href="community.html" class="nav-link active">Community</a>
                <a href="profile.html" class="nav-link">Profile</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-menu" id="userMenu"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <!-- User Reputation Header -->
        <div id="user-reputation" class="reputation-container">
            <!-- Reputation display will be loaded here -->
        </div>

        <!-- Community Tabs -->
        <div class="tabs">
            <button class="tab-button active" data-tab="ice-breakers">
                <i class="fas fa-comments"></i> Ice Breakers
            </button>
            <button class="tab-button" data-tab="teams">
                <i class="fas fa-users"></i> Team Formation
            </button>
            <button class="tab-button" data-tab="leaderboard">
                <i class="fas fa-trophy"></i> Leaderboard
            </button>
            <button class="tab-button" data-tab="social-graph">
                <i class="fas fa-network-wired"></i> My Network
            </button>
            <button class="tab-button" data-tab="groups">
                <i class="fas fa-layer-group"></i> Groups
            </button>
        </div>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Ice Breakers Tab -->
            <div id="ice-breakers" class="tab-pane active">
                <div id="ice-breaker-container">
                    <!-- Ice breaker prompts will be loaded here -->
                </div>
                
                <div class="recent-responses">
                    <h3>Recent Community Responses</h3>
                    <div id="community-responses">
                        <!-- Community responses will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Teams Tab -->
            <div id="teams" class="tab-pane">
                <div class="teams-header">
                    <h2>Find or Create Teams</h2>
                    <button class="btn-primary" onclick="window.CommunityReputation.showTeamFormationModal()">
                        <i class="fas fa-plus"></i> Create New Team
                    </button>
                </div>
                
                <div id="team-recommendations">
                    <!-- Team recommendations will be loaded here -->
                </div>
                
                <div class="my-teams">
                    <h3>My Teams</h3>
                    <div id="user-teams">
                        <!-- User's teams will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Leaderboard Tab -->
            <div id="leaderboard" class="tab-pane">
                <div class="leaderboard-filters">
                    <select id="leaderboard-type">
                        <option value="reputation">Reputation Points</option>
                        <option value="helpfulness">Most Helpful</option>
                        <option value="games_organized">Games Organized</option>
                        <option value="community_builder">Community Builder</option>
                    </select>
                    
                    <select id="leaderboard-timeframe">
                        <option value="all">All Time</option>
                        <option value="month">This Month</option>
                        <option value="week">This Week</option>
                    </select>
                </div>
                
                <div id="leaderboard-content">
                    <!-- Leaderboard will be loaded here -->
                </div>
            </div>

            <!-- Social Graph Tab -->
            <div id="social-graph" class="tab-pane">
                <div class="graph-header">
                    <h2>Your Sports Network</h2>
                    <p>See how you're connected to the community</p>
                </div>
                
                <div id="social-graph-container">
                    <!-- Social graph visualization will be loaded here -->
                </div>
                
                <div class="connection-stats">
                    <h3>Connection Statistics</h3>
                    <div id="connection-stats-grid">
                        <!-- Stats will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Groups Tab -->
            <div id="groups" class="tab-pane">
                <div class="groups-header">
                    <h2>Community Groups</h2>
                    <button class="btn-primary" onclick="window.CommunityReputation.showCreateGroupModal()">
                        <i class="fas fa-plus"></i> Create Group
                    </button>
                </div>
                
                <div class="groups-filters">
                    <select id="group-category">
                        <option value="">All Categories</option>
                        <option value="sport">Sport-Specific</option>
                        <option value="location">Location-Based</option>
                        <option value="skill_level">Skill Level</option>
                        <option value="interest">Interest-Based</option>
                        <option value="social">Social</option>
                    </select>
                </div>
                
                <div id="community-groups">
                    <!-- Groups will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 Finding Sports. Building stronger communities through sports.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dark-mode-fix.js"></script>
    <script src="js/community-reputation.js"></script>
    <script>
        // Tab switching functionality
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                const tabId = button.dataset.tab;
                
                // Update active states
                document.querySelectorAll('.tab-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelectorAll('.tab-pane').forEach(pane => {
                    pane.classList.remove('active');
                });
                
                button.classList.add('active');
                document.getElementById(tabId).classList.add('active');
                
                // Load content for the selected tab
                loadTabContent(tabId);
            });
        });

        // Load content based on active tab
        async function loadTabContent(tabId) {
            switch (tabId) {
                case 'ice-breakers':
                    await window.CommunityReputation.showIceBreakerInterface();
                    break;
                case 'teams':
                    await window.CommunityReputation.showTeamRecommendations();
                    break;
                case 'leaderboard':
                    await loadLeaderboard();
                    break;
                case 'social-graph':
                    await window.CommunityReputation.loadSocialGraph();
                    break;
                case 'groups':
                    await loadCommunityGroups();
                    break;
            }
        }

        // Load leaderboard
        async function loadLeaderboard() {
            const type = document.getElementById('leaderboard-type').value;
            const timeframe = document.getElementById('leaderboard-timeframe').value;
            
            try {
                const response = await fetch(`/api/gamification/leaderboard?type=${type}&timeframe=${timeframe}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    displayLeaderboard(data);
                }
            } catch (error) {
                console.error('Error loading leaderboard:', error);
            }
        }

        // Display leaderboard
        function displayLeaderboard(data) {
            const container = document.getElementById('leaderboard-content');
            
            container.innerHTML = `
                <div class="leaderboard-list">
                    ${data.leaderboard.map((entry, index) => `
                        <div class="leaderboard-entry ${index < 3 ? 'top-three' : ''}">
                            <div class="rank">
                                ${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : index + 1}
                            </div>
                            <div class="user-info">
                                <img src="${entry.picture || '/images/default-avatar.png'}" alt="${entry.name}">
                                <div>
                                    <div class="user-name">${entry.name}</div>
                                    <div class="user-stats">${formatStats(entry, data.type)}</div>
                                </div>
                            </div>
                            <div class="score">
                                ${entry.value}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Format stats based on leaderboard type
        function formatStats(entry, type) {
            switch (type) {
                case 'reputation':
                    return `Level ${entry.level} • ${entry.badges?.length || 0} badges`;
                case 'helpfulness':
                    return `${entry.helpful_answers || 0} helpful answers`;
                case 'games_organized':
                    return `${entry.games_hosted || 0} games hosted`;
                case 'community_builder':
                    return `${entry.people_helped || 0} people helped`;
                default:
                    return '';
            }
        }

        // Load community groups
        async function loadCommunityGroups() {
            const category = document.getElementById('group-category').value;
            const groups = await window.CommunityReputation.getCommunityGroups({ category });
            
            const container = document.getElementById('community-groups');
            container.innerHTML = `
                <div class="groups-grid">
                    ${groups.map(group => `
                        <div class="group-card">
                            <div class="group-header">
                                <h4>${group.name}</h4>
                                <span class="group-category">${formatCategory(group.category)}</span>
                            </div>
                            <p class="group-description">${group.description || 'No description'}</p>
                            <div class="group-stats">
                                <span><i class="fas fa-users"></i> ${group.actual_member_count} members</span>
                                <span><i class="fas fa-chart-line"></i> Activity: ${group.activity_score}</span>
                            </div>
                            <div class="group-actions">
                                <button class="btn-join-group" data-group-id="${group.id}">
                                    ${group.is_member ? 'View Group' : 'Join Group'}
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Format category names
        function formatCategory(category) {
            const categories = {
                'sport': 'Sport-Specific',
                'location': 'Location-Based',
                'skill_level': 'Skill Level',
                'interest': 'Interest-Based',
                'social': 'Social'
            };
            return categories[category] || category;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize community reputation system
            await window.CommunityReputation.initialize();
            
            // Load initial tab content
            await loadTabContent('ice-breakers');
            
            // Set up leaderboard filters
            document.getElementById('leaderboard-type').addEventListener('change', loadLeaderboard);
            document.getElementById('leaderboard-timeframe').addEventListener('change', loadLeaderboard);
            document.getElementById('group-category').addEventListener('change', loadCommunityGroups);
        });
    </script>
</body>
</html>
