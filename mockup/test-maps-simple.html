<!DOCTYPE html>
<html>
<head>
    <title>Simple Google Maps Test</title>
    <style>
        #map { height: 400px; width: 100%; }
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffcccc; color: #660000; }
        .success { background: #ccffcc; color: #006600; }
    </style>
</head>
<body>
    <h1>Google Maps API Test</h1>
    <div id="status" class="status">Loading...</div>
    <div id="map"></div>
    
    <h2>How to Fix:</h2>
    <ol>
        <li>Get your own API key from <a href="https://console.cloud.google.com">Google Cloud Console</a></li>
        <li>Enable "Maps JavaScript API" in the console</li>
        <li>Replace the API key in /mockup/js/config.js with your key</li>
        <li>Add your domain to the API key restrictions</li>
    </ol>

    <script>
        let map;
        const API_KEY = 'AIzaSyBqVDmKw7sY5lqqOJlk1b5cMYjCXf-xlG4';
        
        function initMap() {
            try {
                map = new google.maps.Map(document.getElementById('map'), {
                    center: {lat: 49.2827, lng: -123.1207},
                    zoom: 12
                });
                
                // Add a marker
                new google.maps.Marker({
                    position: {lat: 49.2827, lng: -123.1207},
                    map: map,
                    title: 'Vancouver'
                });
                
                document.getElementById('status').className = 'status success';
                document.getElementById('status').textContent = '✅ Google Maps loaded successfully!';
            } catch (error) {
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = '❌ Error: ' + error.message;
            }
        }
        
        window.gm_authFailure = function() {
            document.getElementById('status').className = 'status error';
            document.getElementById('status').textContent = '❌ Google Maps authentication failed! Invalid API key or restrictions.';
        };
        
        // Load the script
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&callback=initMap`;
        script.onerror = function() {
            document.getElementById('status').className = 'status error';
            document.getElementById('status').textContent = '❌ Failed to load Google Maps script.';
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
