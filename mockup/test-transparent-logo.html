<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Transparency Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(45deg, #ff0000 25%, #00ff00 25%, #00ff00 50%, #0000ff 50%, #0000ff 75%, #ffff00 75%);
            background-size: 100px 100px;
            font-family: Arial, sans-serif;
        }
        
        .test-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        /* Original logo with shadow */
        .logo-original {
            height: 192px;
            width: auto;
            filter: drop-shadow(0 2px 8px rgba(244, 197, 66, 0.3));
            background: transparent;
        }
        
        /* Logo without shadow */
        .logo-no-shadow {
            height: 192px;
            width: auto;
            background: transparent;
        }
        
        /* Logo with no background and no effects */
        .logo-pure {
            height: 192px;
            width: auto;
            background: transparent;
            filter: none;
            box-shadow: none;
            border: none;
            outline: none;
        }
        
        /* Dark background test */
        .dark-bg {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
        }
        
        /* Light background test */
        .light-bg {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
        }
        
        /* Gradient background test */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">Logo Transparency Test</h1>
        
        <div class="test-section">
            <h2>Original Logo (with drop shadow)</h2>
            <img src="images/logo2.png" alt="Finding Sports" class="logo-original" />
            <p>This has the drop-shadow filter applied</p>
        </div>
        
        <div class="test-section">
            <h2>Logo without shadow</h2>
            <img src="images/logo2.png" alt="Finding Sports" class="logo-no-shadow" />
            <p>No filters or effects</p>
        </div>
        
        <div class="test-section">
            <h2>Logo on different backgrounds</h2>
            <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
                <div class="dark-bg">
                    <img src="images/logo2.png" alt="Finding Sports" class="logo-pure" />
                    <p style="color: white;">Dark background</p>
                </div>
                <div class="light-bg">
                    <img src="images/logo2.png" alt="Finding Sports" class="logo-pure" />
                    <p>Light background</p>
                </div>
                <div class="gradient-bg">
                    <img src="images/logo2.png" alt="Finding Sports" class="logo-pure" />
                    <p style="color: white;">Gradient background</p>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>Direct on page background (no container)</h2>
        </div>
        <img src="images/logo2.png" alt="Finding Sports" class="logo-pure" style="margin: 20px;" />
    </div>
</body>
</html>
