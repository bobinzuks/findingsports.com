# Railway Configuration
# Forces fresh deployments and prevents caching issues

[build]
builder = "nixpacks"
buildCommand = "cd backend && npm install && cd .. && node update-asset-versions.js"

[deploy]
startCommand = "cd backend && node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "always"

# Force Railway to disable CDN caching completely
[cdn]
enabled = false
cachePolicy = "bypass"

# Custom headers to force no-cache at edge
[headers]
"/*" = [
  "Cache-Control: no-store, no-cache, must-revalidate, proxy-revalidate",
  "Pragma: no-cache", 
  "Expires: 0",
  "Surrogate-Control: no-store",
  "X-Railway-Cache: disabled"
]

# Environment variable defaults
[variables]
NODE_ENV = "production"
BUILD_VERSION = "$RAILWAY_DEPLOYMENT_ID"
FORCE_NO_CACHE = "true"
RAILWAY_CDN_DISABLED = "true"

# Deployment settings to ensure fresh content
[experimental]
# Force new deployment even if no code changes detected
alwaysBuild = true
# Disable Railway's internal caching
internalCaching = false