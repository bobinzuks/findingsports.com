version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: finding_sports_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finding_sports
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finding_sports_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./finding-sports-backend
      dockerfile: Dockerfile
    container_name: finding_sports_backend
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/finding_sports
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development-secret-key
      PORT: 8080
      ENVIRONMENT: development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./finding-sports-backend:/app
    command: cargo watch -x run

  frontend:
    image: node:20-alpine
    container_name: finding_sports_frontend
    working_dir: /app
    volumes:
      - ./mockup:/app
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install -g http-server &&
             http-server -p 3000 -c-1"

volumes:
  postgres_data:
  redis_data: