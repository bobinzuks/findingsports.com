<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finding Sports - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="auth-container">
            <div class="auth-box">
                <h1 class="logo">Finding Sports</h1>
                <p class="tagline">Finding Sports near you—wherever, whenever.</p>
                
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
                    <button class="auth-tab" onclick="switchAuthTab('register')">Sign Up</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required 
                               placeholder="demo@example.com" value="demo@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required 
                               placeholder="Enter your password" value="demo123">
                    </div>
                    
                    <button type="submit" class="auth-btn">Login</button>
                    
                    <div class="demo-info">
                        <p>Demo Account:</p>
                        <p>Email: demo@example.com</p>
                        <p>Password: demo123</p>
                    </div>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="auth-form" style="display: none;">
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" name="email" required 
                               placeholder="your@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="regUsername">Username</label>
                        <input type="text" id="regUsername" name="username" required 
                               placeholder="Choose a username">
                    </div>
                    
                    <div class="form-group">
                        <label for="regFullName">Full Name (Optional)</label>
                        <input type="text" id="regFullName" name="fullName" 
                               placeholder="Your full name">
                    </div>
                    
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" name="password" required 
                               placeholder="Create a password">
                    </div>
                    
                    <button type="submit" class="auth-btn">Sign Up</button>
                </form>

                <div id="authMessage" class="auth-message"></div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
