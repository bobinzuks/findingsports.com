<!DOCTYPE html>
<html>
<head>
    <title>Button Test - Finding Sports</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; }
        button { padding: 1rem 2rem; margin: 1rem; font-size: 1.2rem; cursor: pointer; }
        .search-btn { background: #007bff; color: white; border: none; border-radius: 8px; }
        .play-now-btn { background: #ff6b35; color: white; border: none; border-radius: 8px; }
        #output { margin-top: 2rem; padding: 1rem; background: #f0f0f0; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Finding Sports - Button Test</h1>
    
    <button class="search-btn" onclick="testSearch()">Test Search</button>
    <button class="play-now-btn" onclick="testPlayNow()">Test Play Now</button>
    
    <div id="output">Click a button to test...</div>
    
    <script>
        function testSearch() {
            const output = document.getElementById('output');
            output.innerHTML = '<h2>Testing Search...</h2>';
            
            fetch('https://findingsports.com/api/games')
                .then(r => r.json())
                .then(data => {
                    output.innerHTML = `
                        <h2>Search Results</h2>
                        <p>API Response: ${JSON.stringify(data).substring(0, 200)}...</p>
                        <p>Games found: ${data.games ? data.games.length : 0}</p>
                    `;
                })
                .catch(err => {
                    output.innerHTML = `<h2>Error</h2><p>${err.message}</p>`;
                });
        }
        
        function testPlayNow() {
            const output = document.getElementById('output');
            output.innerHTML = '<h2>Testing Play Now...</h2>';
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    fetch(`https://findingsports.com/api/play-now?lat=${pos.coords.latitude}&lng=${pos.coords.longitude}&radius=10`)
                        .then(r => r.json())
                        .then(data => {
                            output.innerHTML = `
                                <h2>Play Now Results</h2>
                                <p>Location: ${pos.coords.latitude}, ${pos.coords.longitude}</p>
                                <p>API Response: ${JSON.stringify(data).substring(0, 200)}...</p>
                            `;
                        });
                },
                (err) => {
                    // Test with Vancouver
                    fetch('https://findingsports.com/api/play-now?lat=49.2827&lng=-123.1207&radius=10')
                        .then(r => r.json())
                        .then(data => {
                            output.innerHTML = `
                                <h2>Play Now Results (Vancouver)</h2>
                                <p>Location access denied - using Vancouver</p>
                                <p>API Response: ${JSON.stringify(data).substring(0, 200)}...</p>
                            `;
                        });
                }
            );
        }
    </script>
</body>
</html>
