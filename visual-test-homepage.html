<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual Test - Finding Sports Homepage</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-frame { width: 100%; height: 600px; border: 2px solid #333; }
        .test-section { margin: 20px 0; padding: 15px; background: #f5f5f5; }
        .fail { color: red; font-weight: bold; }
        .pass { color: green; font-weight: bold; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Deep Visual Testing - Finding Sports</h1>
    
    <div class="test-section">
        <h2>Test 1: Removed UI Elements Check</h2>
        <p>Looking for these elements that should be REMOVED:</p>
        <ol>
            <li>Language selector (globe icon/dropdown)</li>
            <li>Online status indicator</li>
            <li>Help button (question mark)</li>
        </ol>
        <button onclick="runDeepTest()">Run Deep Analysis</button>
        <div id="results"></div>
    </div>

    <iframe class="test-frame" src="https://findingsports.com" id="testFrame"></iframe>

    <script>
        function runDeepTest() {
            const results = document.getElementById('results');
            results.innerHTML = '<h3>Test Results:</h3>';
            
            // Test 1: Check page source
            fetch('https://findingsports.com')
                .then(response => response.text())
                .then(html => {
                    // Check for language selector patterns
                    const langPatterns = [
                        'language-selector',
                        'fa-globe',
                        'lang-dropdown',
                        'select-language',
                        '🌐'
                    ];
                    
                    // Check for online indicator patterns
                    const onlinePatterns = [
                        'online-indicator',
                        'status-online',
                        'connection-status',
                        'online-badge',
                        'status-indicator'
                    ];
                    
                    // Check for help button patterns
                    const helpPatterns = [
                        'help-btn',
                        'fa-question',
                        'help-button',
                        'question-circle',
                        'help-icon'
                    ];
                    
                    let failures = [];
                    
                    langPatterns.forEach(pattern => {
                        if (html.includes(pattern)) {
                            failures.push(`Found language selector pattern: "${pattern}"`);
                        }
                    });
                    
                    onlinePatterns.forEach(pattern => {
                        if (html.includes(pattern)) {
                            failures.push(`Found online indicator pattern: "${pattern}"`);
                        }
                    });
                    
                    helpPatterns.forEach(pattern => {
                        if (html.includes(pattern)) {
                            failures.push(`Found help button pattern: "${pattern}"`);
                        }
                    });
                    
                    if (failures.length > 0) {
                        results.innerHTML += '<div class="fail">FAILED - Found removed elements:</div>';
                        failures.forEach(f => {
                            results.innerHTML += `<div class="fail">- ${f}</div>`;
                        });
                    } else {
                        results.innerHTML += '<div class="pass">PASSED - No removed elements found</div>';
                    }
                })
                .catch(err => {
                    results.innerHTML += '<div>Error: ' + err.message + '</div>';
                });
        }
    </script>
</body>
</html>
