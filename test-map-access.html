<!DOCTYPE html>
<html>
<head>
    <title>Map Access Test</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; background: #f0f0f0; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Deep Test 2: Map Without Login</h1>
    
    <div class="test">
        <h3>Test 2.1: Page Load Check</h3>
        <button onclick="testPageLoad()">Test Page Load</button>
        <div id="test1-result"></div>
    </div>

    <div class="test">
        <h3>Test 2.2: Map Container Check</h3>
        <button onclick="testMapContainer()">Test Map Container</button>
        <div id="test2-result"></div>
    </div>

    <div class="test">
        <h3>Test 2.3: MapLibre Loading</h3>
        <button onclick="testMapLibre()">Test MapLibre</button>
        <div id="test3-result"></div>
    </div>

    <script>
        function testPageLoad() {
            fetch('https://findingsports.com')
                .then(response => response.text())
                .then(html => {
                    const hasMapDiv = html.includes('id="map"');
                    const hasMapLibre = html.includes('maplibre-gl');
                    const requiresAuth = html.includes('requireLogin') && html.includes('map');
                    
                    document.getElementById('test1-result').innerHTML = `
                        <p>Map div found: ${hasMapDiv ? '<span class="pass">YES</span>' : '<span class="fail">NO</span>'}</p>
                        <p>MapLibre referenced: ${hasMapLibre ? '<span class="pass">YES</span>' : '<span class="fail">NO</span>'}</p>
                        <p>Map requires auth: ${requiresAuth ? '<span class="fail">YES</span>' : '<span class="pass">NO</span>'}</p>
                    `;
                });
        }

        function testMapContainer() {
            // Test if map container exists and is visible
            document.getElementById('test2-result').innerHTML = 'Testing map container...';
        }

        function testMapLibre() {
            // Test if MapLibre loads
            document.getElementById('test3-result').innerHTML = 'Testing MapLibre loading...';
        }
    </script>
</body>
</html>
