<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login Button</title>
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .header-right { background: #f0f0f0; padding: 10px; }
        button { margin: 5px; }
    </style>
</head>
<body>
    <h1>Login Button Test</h1>
    
    <div class="test-section">
        <h2>Current Header Right Content:</h2>
        <div class="header-right user-menu" id="headerRight">
            <!-- Login button should appear here -->
        </div>
    </div>
    
    <div class="test-section">
        <h2>Test Controls:</h2>
        <button onclick="testLoginManager()">Test LoginManager</button>
        <button onclick="testShowModal()">Test Show Modal</button>
        <button onclick="checkLoginButton()">Check Login Button</button>
    </div>
    
    <div class="test-section">
        <h2>Console Output:</h2>
        <div id="output" style="background: #f5f5f5; padding: 10px; height: 200px; overflow-y: auto;"></div>
    </div>

    <!-- Include the same scripts as index.html -->
    <link rel="stylesheet" href="mockup/css/login-styles.css" />
    <script src="mockup/js/login-component.js"></script>
    
    <script>
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
            output.scrollTop = output.scrollHeight;
            console.log(message);
        }
        
        function testLoginManager() {
            log('Testing LoginManager availability...');
            log('window.LoginManager: ' + (typeof window.LoginManager));
            log('window.loginManager: ' + (typeof window.loginManager));
            
            if (window.loginManager) {
                log('LoginManager instance found!');
                log('isLoggedIn: ' + window.loginManager.isLoggedIn);
            } else {
                log('No LoginManager instance found');
            }
        }
        
        function testShowModal() {
            log('Testing showLoginModal...');
            if (window.loginManager && typeof window.loginManager.showLoginModal === 'function') {
                log('Calling showLoginModal...');
                window.loginManager.showLoginModal();
            } else {
                log('showLoginModal not available');
            }
        }
        
        function checkLoginButton() {
            log('Checking login button...');
            const headerRight = document.querySelector('.header-right');
            const loginBtn = document.querySelector('.login-btn');
            const authSection = document.querySelector('.auth-section');
            
            log('headerRight element: ' + (headerRight ? 'found' : 'not found'));
            log('login button: ' + (loginBtn ? 'found' : 'not found'));
            log('auth section: ' + (authSection ? 'found' : 'not found'));
            
            if (loginBtn) {
                log('Login button onclick: ' + loginBtn.getAttribute('onclick'));
            }
        }
        
        // Wait for DOM and then initialize
        document.addEventListener('DOMContentLoaded', function() {
            log('DOM ready');
            
            // Wait a bit for login component to load
            setTimeout(() => {
                log('Running initial tests...');
                testLoginManager();
                checkLoginButton();
                
                // Force LoginManager creation if needed
                if (!window.loginManager && window.LoginManager) {
                    log('Creating LoginManager instance...');
                    window.loginManager = new LoginManager();
                    setTimeout(() => {
                        log('After manual initialization:');
                        testLoginManager();
                        checkLoginButton();
                    }, 100);
                }
            }, 500);
        });
    </script>
</body>
</html>
