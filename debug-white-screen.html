<!DOCTYPE html>
<html>
<head>
    <title>Debug White Screen</title>
</head>
<body>
    <h1>Debug Finding Sports White Screen</h1>
    <p>Open this file in your browser, then click the button to test the site:</p>
    
    <button onclick="testSite()">Test Finding Sports</button>
    
    <div id="results" style="margin-top: 20px; padding: 20px; background: #f0f0f0;">
        <h2>Results will appear here...</h2>
    </div>

    <script>
    async function testSite() {
        const results = document.getElementById('results');
        results.innerHTML = '<h2>Testing...</h2>';
        
        try {
            // Test 1: Fetch the main page
            const response = await fetch('https://findingsports.com/', {
                cache: 'no-store',
                headers: {
                    'Cache-Control': 'no-cache'
                }
            });
            
            const html = await response.text();
            
            // Check what's in the HTML
            const checks = {
                'Page size': html.length + ' bytes',
                'Has Nuclear Fix': html.includes('nuclear-fix-v6') ? '✅ Yes' : '❌ No',
                'Has Incognito Fix': html.includes('incognito-fix') ? '✅ Yes' : '❌ No',
                'Has Language Selector': html.includes('🌐 English') ? '❌ Yes (BAD)' : '✅ No (GOOD)',
                'Has Help Button': html.includes('? Help') ? '❌ Yes (BAD)' : '✅ No (GOOD)',
                'Has DOCTYPE': html.includes('<!doctype') ? '✅ Yes' : '❌ No',
                'Has Body Tag': html.includes('<body') ? '✅ Yes' : '❌ No'
            };
            
            // Test 2: Check JavaScript files
            const jsTests = [
                'https://findingsports.com/js/ultimate-nuclear-fix-v6.js',
                'https://findingsports.com/js/incognito-fix.js'
            ];
            
            for (const jsUrl of jsTests) {
                try {
                    const jsResponse = await fetch(jsUrl, { cache: 'no-store' });
                    const jsContent = await jsResponse.text();
                    const filename = jsUrl.split('/').pop();
                    
                    if (jsContent.includes('<!doctype')) {
                        checks[filename] = '❌ Returns HTML (NOT JavaScript)';
                    } else if (jsContent.includes('function')) {
                        checks[filename] = '✅ Returns JavaScript';
                    } else {
                        checks[filename] = '❓ Unknown content';
                    }
                } catch (e) {
                    checks[jsUrl] = '❌ Error: ' + e.message;
                }
            }
            
            // Display results
            let resultHTML = '<h2>Test Results:</h2><table border="1" cellpadding="5">';
            for (const [test, result] of Object.entries(checks)) {
                resultHTML += `<tr><td><strong>${test}:</strong></td><td>${result}</td></tr>`;
            }
            resultHTML += '</table>';
            
            // Check for specific issues
            resultHTML += '<h3>Diagnosis:</h3>';
            if (!html.includes('nuclear-fix-v6')) {
                resultHTML += '<p>❌ <strong>Nuclear Fix is not in the HTML!</strong></p>';
            }
            if (!html.includes('incognito-fix')) {
                resultHTML += '<p>❌ <strong>Incognito Fix is not in the HTML!</strong></p>';
            }
            if (html.length < 50000) {
                resultHTML += '<p>❌ <strong>Page seems too small, might be an error page</strong></p>';
            }
            
            // Show first part of HTML
            resultHTML += '<h3>First 500 characters of HTML:</h3>';
            resultHTML += '<pre>' + html.substring(0, 500).replace(/</g, '&lt;').replace(/>/g, '&gt;') + '...</pre>';
            
            results.innerHTML = resultHTML;
            
        } catch (error) {
            results.innerHTML = '<h2>Error:</h2><p style="color: red;">' + error.message + '</p>';
        }
    }
    </script>
</body>
</html>
