<!DOCTYPE html>
<html>
<head>
    <title>Real F12 Test - Finding Sports</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-frame { width: 100%; height: 600px; border: 2px solid #333; margin: 20px 0; }
        .results { background: #f0f0f0; padding: 20px; margin: 20px 0; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Real F12 Developer Tools Test</h1>
    
    <button onclick="runF12Test()">Run F12 Diagnostic</button>
    
    <div id="results" class="results">
        <h2>Results will appear here...</h2>
    </div>
    
    <h2>Live Site Preview:</h2>
    <iframe src="https://findingsports.com" class="test-frame" id="siteFrame"></iframe>
    
    <script>
    async function runF12Test() {
        const results = document.getElementById('results');
        results.innerHTML = '<h2>Running diagnostics...</h2>';
        
        try {
            // Test 1: Can we reach the site?
            const response = await fetch('https://findingsports.com', {
                mode: 'no-cors'
            });
            
            let html = '<h2>🔍 F12 Diagnostic Results:</h2>';
            
            // Test 2: Check iframe
            const iframe = document.getElementById('siteFrame');
            
            // Try to access iframe content (will fail due to CORS but shows attempt)
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                html += '<p class="success">✅ Iframe loaded</p>';
            } catch (e) {
                html += '<p class="error">❌ Cannot access iframe content (CORS protection)</p>';
            }
            
            // Test 3: Direct fetch
            try {
                const testResponse = await fetch('https://findingsports.com/js/ultimate-nuclear-fix-v6.js');
                const jsContent = await testResponse.text();
                
                if (jsContent.includes('NUCLEAR FIX')) {
                    html += '<p class="success">✅ Nuclear Fix JS loads correctly</p>';
                } else if (jsContent.includes('<!doctype')) {
                    html += '<p class="error">❌ JS file returns HTML!</p>';
                } else {
                    html += '<p class="error">❌ Unknown JS content</p>';
                }
            } catch (e) {
                html += '<p class="error">❌ Error loading JS: ' + e.message + '</p>';
            }
            
            // Test 4: Visual check
            html += '<h3>Visual Check:</h3>';
            html += '<p>Look at the iframe below. What do you see?</p>';
            html += '<ul>';
            html += '<li>White/blank page? → JavaScript or CSS issue</li>';
            html += '<li>Content but with language selector? → Nuclear Fix not working</li>';
            html += '<li>Clean content without language selector? → Success!</li>';
            html += '</ul>';
            
            // Test 5: Create clean version
            html += '<h3>Testing without Nuclear Fix:</h3>';
            html += '<p>Open this in a new tab to see site without Nuclear Fix:</p>';
            html += '<p><a href="https://findingsports.com" target="_blank">https://findingsports.com</a></p>';
            html += '<p>Then press F12 and check:</p>';
            html += '<ol>';
            html += '<li>Console tab for errors</li>';
            html += '<li>Network tab to see if JS files load</li>';
            html += '<li>Elements tab to see if content exists but is hidden</li>';
            html += '</ol>';
            
            results.innerHTML = html;
            
        } catch (error) {
            results.innerHTML = '<h2 class="error">Error: ' + error.message + '</h2>';
        }
    }
    </script>
</body>
</html>
