[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
dependsOn = ["setup"]
cmds = ["python -m pip install -r railway-requirements.txt"]

[start]
cmd = "python -m gunicorn railway_integration:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --log-level info"

[providers]
python = "python311"