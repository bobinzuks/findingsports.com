<!DOCTYPE html>
<html>
<head>
    <title>Test Login - Finding Sports</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Test Login Page</h1>
    <p>Testing login functionality...</p>
    
    <script>
        // Test if login page exists
        fetch('https://findingsports.com/login.html')
            .then(response => {
                console.log('Login page status:', response.status);
                document.write('<p>Login page status: ' + response.status + '</p>');
            })
            .catch(error => {
                console.error('Login page error:', error);
                document.write('<p>Login page error: ' + error + '</p>');
            });
            
        // Test auth endpoints
        fetch('https://findingsports.com/api/auth/status')
            .then(response => response.json())
            .then(data => {
                console.log('Auth status:', data);
                document.write('<p>Auth status: ' + JSON.stringify(data) + '</p>');
            })
            .catch(error => {
                console.error('Auth error:', error);
            });
    </script>
</body>
</html>
