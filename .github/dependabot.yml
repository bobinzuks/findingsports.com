version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/mockup/finding-sports-backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "bobinzuks"
    labels:
      - "dependencies"
      - "rust"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "bobinzuks"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker
  - package-ecosystem: "docker"
    directory: "/mockup/finding-sports-backend"
    schedule:
      interval: "weekly"
    assignees:
      - "bobinzuks"
    labels:
      - "dependencies"
      - "docker"