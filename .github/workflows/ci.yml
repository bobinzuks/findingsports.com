name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Frontend tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate HTML
      run: |
        echo "Skipping HTML validation - no package.json in root"
    
    - name: Check JavaScript
      run: |
        echo "JavaScript files exist in mockup/js/"
        ls -la mockup/js/*.js | head -10

  # Backend tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '18'
    
    - name: Install backend dependencies
      run: |
        cd mockup/backend
        if [ -f package.json ]; then
          npm install
        else
          echo "No package.json found, skipping install"
        fi
    
    - name: Check backend files
      run: |
        echo "Backend server exists:"
        ls -la mockup/backend/server.js

  # Deploy to Railway (automatic via GitHub integration)
  deploy-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Deployment Info
      run: |
        echo "✅ Code pushed to main branch"
        echo "Railway should auto-deploy via GitHub integration"
        echo "Check Railway dashboard for deployment status"