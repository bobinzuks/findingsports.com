name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - staging
        - production
      
      platform:
        description: 'Deployment platform'
        required: true
        default: 'railway'
        type: choice
        options:
        - railway
        - vercel

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup deployment
      run: |
        echo "Deploying to ${{ inputs.environment }} on ${{ inputs.platform }}"
    
    # Railway deployment
    - name: Deploy to Railway
      if: inputs.platform == 'railway'
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        if [ -z "$RAILWAY_TOKEN" ]; then
          echo "❌ RAILWAY_TOKEN secret not set!"
          echo "Please add RAILWAY_TOKEN to repository secrets"
          exit 1
        fi
        
        npm i -g @railway/cli
        
        # Railway CLI doesn't support --environment flag
        # Just deploy to the linked project
        railway up --detach
        
        echo "✅ Deployment triggered on Railway"
        echo "Check Railway dashboard for status"
    
    # Vercel deployment (for the static site)
    - name: Deploy to Vercel
      if: inputs.platform == 'vercel'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        if [ -z "$VERCEL_TOKEN" ]; then
          echo "❌ VERCEL_TOKEN secret not set!"
          echo "Please add VERCEL_TOKEN to repository secrets"
          exit 1
        fi
        
        npm i -g vercel
        cd mockup
        vercel --prod --token $VERCEL_TOKEN --yes
    
    - name: Post-deployment info
      run: |
        echo "📋 Deployment Summary:"
        echo "Platform: ${{ inputs.platform }}"
        echo "Environment: ${{ inputs.environment }}"
        echo "Commit: ${{ github.sha }}"
        
        if [ "${{ inputs.platform }}" = "railway" ]; then
          echo ""
          echo "🚂 Railway Deployment:"
          echo "Check status at: https://railway.app"
          echo "Site URL: https://findingsports.com"
        else
          echo ""
          echo "▲ Vercel Deployment:"
          echo "Check the build output above for the deployment URL"
        fi
    
    # Optional Slack notification (only if webhook is set)
    - name: Notify Slack
      if: always() && env.SLACK_WEBHOOK_URL != ''
      uses: 8398a7/action-slack@v3
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        status: ${{ job.status }}
        text: |
          Deployment to ${{ inputs.environment }} on ${{ inputs.platform }}
          Status: ${{ job.status }}
          Commit: ${{ github.sha }}