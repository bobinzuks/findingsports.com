name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - staging
        - production
      
      platform:
        description: 'Deployment platform'
        required: true
        default: 'railway'
        type: choice
        options:
        - railway
        - fly
        - vercel

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup deployment
      run: |
        echo "Deploying to ${{ inputs.environment }} on ${{ inputs.platform }}"
    
    # Railway deployment
    - name: Deploy to Railway
      if: inputs.platform == 'railway'
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        npm i -g @railway/cli
        railway up --environment ${{ inputs.environment }}
    
    # Fly.io deployment
    - name: Deploy to Fly.io
      if: inputs.platform == 'fly'
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: |
        curl -L https://fly.io/install.sh | sh
        export FLYCTL_INSTALL="/home/runner/.fly"
        export PATH="$FLYCTL_INSTALL/bin:$PATH"
        
        cd mockup/finding-sports-backend
        fly deploy --config fly.toml --app finding-sports-${{ inputs.environment }}
    
    # Vercel deployment (frontend only)
    - name: Deploy to Vercel
      if: inputs.platform == 'vercel'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        npm i -g vercel
        cd mockup
        vercel --prod --token $VERCEL_TOKEN --scope your-team
    
    - name: Post-deployment tests
      run: |
        sleep 60
        case "${{ inputs.platform }}" in
          railway)
            URL="https://finding-sports-${{ inputs.environment }}.railway.app"
            ;;
          fly)
            URL="https://finding-sports-${{ inputs.environment }}.fly.dev"
            ;;
          vercel)
            URL="https://finding-sports.vercel.app"
            ;;
        esac
        
        curl -f $URL/health || exit 1
        echo "✅ Deployment successful!"
    
    - name: Notify Slack
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          Deployment to ${{ inputs.environment }} on ${{ inputs.platform }}
          Status: ${{ job.status }}
          Commit: ${{ github.sha }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.environment == 'production'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run migrations
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      run: |
        cd mockup/finding-sports-backend
        cargo install sqlx-cli
        sqlx migrate run